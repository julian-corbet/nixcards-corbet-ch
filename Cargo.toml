[workspace]
members = [
  "crates/nixcards-core",
  "crates/nixcards-store",
  "crates/nixcards-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/julian-corbet/nixcards-corbet-ch"
rust-version = "1.96"

[workspace.dependencies]
crossterm = "0.29.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
tempfile = "3.23.0"
wasm-bindgen = "0.2.127"
