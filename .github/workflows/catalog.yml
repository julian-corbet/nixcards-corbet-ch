name: Publish card catalogue

on:
  push:
    branches: [main]
    paths:
      - cards/**
      - crates/nixcards-core/**
      - crates/nixcards-tui/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/catalog.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-card-catalogue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Validate catalogue contract
        run: |
          cargo run --locked -p nixcards -- validate
          cargo run --locked -p nixcards -- check-catalog-index cards/catalog.json
      - name: Publish cards as the catalogue root
        shell: bash
        run: |
          catalog_commit=$(git subtree split --prefix=cards)
          git push origin "$catalog_commit:refs/heads/catalog"
