name: Deploy web app

on:
  workflow_call:
    inputs:
      app_ref:
        description: Application revision to deploy
        required: true
        type: string
      cards_ref:
        description: Canonical cards revision to bundle
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-nixcards-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.app_ref || github.event.workflow_run.head_sha }}
      - name: Check out canonical cards
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.cards_ref || 'cards' }}
          path: cards
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust and WASM target
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.96.0
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build Rust WASM core
        run: wasm-pack build crates/nixcards-core --target web --out-dir ../../web/src/lib/wasm --features wasm
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build PWA
        working-directory: web
        run: npm run build
      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config ../wrangler.jsonc
