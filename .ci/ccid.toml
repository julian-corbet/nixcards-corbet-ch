schema = 1
project = "nixcards"

# Cards is an exact pinned source dependency. Crow can supply its verified
# archive; otherwise the cards selector fetches that same revision from GitHub.
# Select cards before rust/catalog/web. Existing WASM tools and target must be
# provisioned; the workflow does not install them.

[checks.catalog-source]
kind = "commands"
commands = [["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_catalog_build_guard.py", "-v"], ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_ci_cards_source.py", "-v"], ["cargo", "fmt", "--all", "--check"]]

[checks.cards]
kind = "commands"
commands = [["bash", ".ci/prepare-cards.sh"]]

[checks.rust]
kind = "cargo"
actions = ["fmt", "clippy", "test"]
workspace = true
all_features = true

[checks.catalog]
kind = "commands"
commands = [["cargo", "run", "--locked", "-p", "nixcards", "--", "validate"], ["cargo", "run", "--locked", "-p", "nixcards", "--", "check-catalog-index", "cards/catalog.json"]]

[checks.web]
kind = "commands"
commands = [["wasm-pack", "build", "crates/nixcards-core", "--mode", "no-install", "--target", "web", "--out-dir", "../../web/src/lib/wasm", "--features", "wasm"], ["npm", "--prefix", "web", "ci", "--ignore-scripts", "--no-audit", "--no-fund"], ["npm", "--prefix", "web", "run", "check"], ["npm", "--prefix", "web", "run", "build"]]
